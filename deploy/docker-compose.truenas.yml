# TrueNAS custom app (Apps → Discover Apps → ⋮ → Install via YAML).
# Paste this file's contents into the YAML editor, then set ADDON_TOKEN
# to a real value first: openssl rand -hex 16
services:
  youtube-addon:
    image: ghcr.io/hectormtz22/youtube-addon:latest
    container_name: youtube-addon
    restart: unless-stopped
    ports:
      - "7000:7000"  # Web UI port binding for the app in TrueNAS UI
    environment:
      # REQUIRED — 20+ random chars. Never expose this install URL publicly.
      ADDON_TOKEN: "REPLACE_ME_openssl_rand_hex_16"
      ADDON_ID: "community.ytdlp"
      # poToken provider (see bgutil service below) — fixes YouTube
      # throttling/bot-checks. Internal address only.
      POT_PROVIDER_URL: "http://bgutil:4416"
    depends_on:
      - bgutil
    read_only: true
    tmpfs:
      - /tmp
    networks:
      - pot

  # YouTube poToken provider. UNAUTHENTICATED — never publish ports for it.
  # Reachable only from containers on this network (default: none exposed).
  bgutil:
    image: brainicism/bgutil-ytdlp-pot-provider:2.0.0
    container_name: bgutil-provider
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    networks:
      - pot

networks:
  pot:
    internal: false  # bgutil must reach Google's challenge servers
